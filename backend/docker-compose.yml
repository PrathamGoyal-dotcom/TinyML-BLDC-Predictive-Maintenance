services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinyml-bldc-backend
    ports:
      - "8000:8000"
    environment:
      TINYML_DATABASE_PATH: /app/data/tinyml.db
      TINYML_SSE_HEARTBEAT_SECONDS: "15"
      TINYML_DEFAULT_LANGUAGE: en
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
